[project]
name = "meip"
version = "0.1.0"
description = "Mortgage Evidence Intelligence Platform - backend API and workers"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "structlog>=24.4",
    "pyjwt[crypto]>=2.10",
    "anyio>=4.6",
    "azure-storage-blob>=12.24",
    "pypdfium2>=4.30",
    "reportlab>=4.2",  # Stage 3-C: the evidence pack's summary.pdf
    "httpx>=0.28",  # Phase 4: the OpenAI extraction provider
    "pillow>=10",  # Phase 4: page images for the OpenAI provider (via pypdfium2)
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "pytest-cov>=6.0",
    "httpx>=0.28",
    "mypy>=1.13",
    "ruff>=0.8",
    "asyncpg-stubs>=0.30",
]

[project.scripts]
meip-admin = "meip.cli:main"
meip-worker = "meip.documents.processing:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/meip"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "S", "A", "C4", "SIM", "RUF", "ASYNC", "PT", "DTZ", "TID"]
ignore = ["B008"]  # FastAPI Depends() in defaults is idiomatic

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]
"migrations/**" = ["E501", "S608"]  # SQL built from the migration's own constants

[tool.mypy]
strict = true
python_version = "3.13"
mypy_path = "src"
plugins = ["pydantic.mypy"]
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["alembic.*", "pypdfium2.*", "reportlab.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
addopts = "--strict-markers -ra -m 'not azurite'"
markers = [
    "azurite: needs a running Azurite emulator and MEIP_TEST_AZURITE_CONNECTION_STRING (opt-in: -m azurite)",
]
filterwarnings = ["error::pytest.PytestUnraisableExceptionWarning"]

[tool.coverage.run]
source = ["meip"]
branch = true
# SQLAlchemy's asyncio layer switches greenlets; without this, lines after DB awaits are
# misreported as uncovered. "subprocess" measures the CLI tests, which run meip-admin for real.
concurrency = ["thread", "greenlet"]
patch = ["subprocess"]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "\\.\\.\\.$"]
